workflows:
  ios-workflow:
    name: FUNKY iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.funkyapp.funky
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    # IMPORTANT: replace this with the exact name of your App Store Connect
    # API key integration, found in Codemagic under your account/team
    # Settings -> Integrations -> App Store Connect. That's the same key
    # your earlier (failed) build was already using automatically.
    integrations:
      app_store_connect: YOUR_APP_STORE_CONNECT_INTEGRATION_NAME
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - seanauble@icloud.com
        notify:
          success: true
          failure: true
