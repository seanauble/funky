name: funky
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.0.0+88

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management for the mock data store (AppStore) and theme.
  provider: ^6.1.2
  # Persists the mock store and theme preference across restarts.
  shared_preferences: ^2.3.2
  # Real device location for "your area is the 25 miles around you" (rule 1).
  geolocator: ^13.0.1
  # OpenStreetMap tiles + marker pins for the Places map.
  flutter_map: ^8.1.1
  # Lat/lng type used by flutter_map (kept separate from our own LatLng model).
  latlong2: ^0.9.1
  # True in-app camera (live preview + our own capture button) for Stories —
  # not the OS's own camera/gallery picker sheet. Official Flutter-team
  # package (publisher flutter.dev), not a small community plugin, so this
  # isn't the kind of dependency that broke the iOS build before.
  camera: ^0.12.1
  # Plays back captured Story videos in the Story viewer. Also flutter.dev.
  video_player: ^2.14.0
  # Where captured Story photos/videos get copied so they survive after the
  # camera plugin's own temp file is cleaned up. Also an official package.
  path_provider: ^2.1.4
  # Stitches the before/after clips from a mid-recording camera flip into
  # one continuous-looking video (see _finishRecording in
  # create_flow_screen.dart). This one IS a smaller community package, not
  # an official flutter.dev one — picked deliberately over the much heavier
  # ffmpeg_kit_flutter route (that one bundles the whole ffmpeg binary and
  # its original maintainer archived the project), since this does only
  # the one thing we need (merge) with no ffmpeg binary at all. If a build
  # ever needs to drop this, the merge-only call site is isolated to
  # _finishRecording, and the single-segment (no-flip) path never touches
  # this package at all.
  easy_video_editor: ^0.1.6
  # Lets "change profile picture" also offer "choose from library", not just
  # the in-app camera — Stories stay camera-only (see CameraCaptureScreen),
  # this is only for the profile photo picker. Official flutter.dev package.
  image_picker: ^1.2.3
  # Lets the Story review screen's Save button export a copy of exactly
  # what you just captured straight to the phone's own Camera Roll —
  # separate from posting it as a Story, and separate from the in-app
  # Memories/Timeline archive too. Only needs the NSPhotoLibraryAddUsage/
  # NSPhotoLibraryUsage keys already declared in Info.plist.
  gal: ^2.3.1
  # The real backend. Everything up to now has been a local mock store
  # (see the "no backend" comments in app_store.dart/models.dart/
  # account_screen.dart) — this is what starts replacing that with actual
  # cross-device accounts, friends, Stories, and messages. See
  # lib/data/supabase_config.dart for the project connection info and
  # supabase/schema.sql for the database schema this depends on.
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # FUNKY branding — app logo/wordmark used in-app for header/splash
  # branding (the launcher icon itself is set separately per-platform).
  assets:
    - assets/branding/funky_wordmark.png
    - assets/branding/funky_mark.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# The published easy_video_editor 0.1.6 (declared above) fails to compile on
# Codemagic's Xcode/Swift toolchain — two real bugs in its iOS Swift source,
# confirmed directly against the real package source, not guessed. No newer
# pub.dev release exists and the upstream fix PRs are still open. This
# override points pub at a hand-patched local copy instead of pub.dev — see
# third_party/easy_video_editor/PATCH_NOTES.md for exactly what was changed
# and why, and how to drop this override if upstream ever ships a real fix.
dependency_overrides:
  easy_video_editor:
    path: third_party/easy_video_editor
